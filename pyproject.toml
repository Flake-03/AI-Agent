[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-mcp-orchestrator"
version = "0.1.0"
description = "LangGraph agent that orchestrates tools from a FastMCP HTTP server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph==1.2.12",
    "langchain[mcp]==1.4.2",
    "langchain-openai==1.6.3",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]>=3.2,<4",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

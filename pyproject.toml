[project]
name = "docmind-agents"
version = "0.1.0"
requires-python = ">=3.11,<4.0"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.142.2"
langgraph = "^1.2.12"
